[project]
name = "proofgym"
version = "0.1.0"
description = "Playable worlds with a public formal constitution and a hidden intent spec."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ProofGym" }]
dependencies = [
    "z3-solver>=4.12",
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
proofgym = "proofgym.cli:main"
proofgym-report = "proofgym.report:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["proofgym*"]

[tool.setuptools.package-data]
"proofgym.worlds.museum" = ["traces/*.json"]
"proofgym.worlds.museum_duo" = ["traces/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
